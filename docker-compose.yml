services:
  web:
    build:
      context: .
      target: dev
    # Install on start so the node_modules volume follows package-lock.json
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      # File events do not reach the container through a Windows/macOS bind mount;
      # vite.config.ts switches to polling when this is set
      VITE_WATCH_POLLING: "true"

volumes:
  node_modules:
